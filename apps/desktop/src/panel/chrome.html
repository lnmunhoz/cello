<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'" />
    <title>Cello panel</title>
    <style>
      /* The board's tokens (apps/web/src/index.css), so the panel looks like part of it. */
      :root {
        --surface: #ffffff;
        --sunken: #f7f7f8;
        --hover: #f0f0f2;
        --line: #e4e4e7;
        --ink: #1b1b1f;
        --muted: #6b6f76;
        --faint: #9a9ea6;
        --accent: #5e6ad2;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --surface: #151517;
          --sunken: #121214;
          --hover: #232327;
          --line: #26262a;
          --ink: #e6e6e9;
          --muted: #8b8f98;
          --faint: #62666e;
          --accent: #7c85e8;
          color-scheme: dark;
        }
      }
      html, body { margin: 0; height: 100%; overflow: hidden; }
      body {
        background: var(--surface);
        color: var(--ink);
        font: 13px/1.2 "Inter Variable", Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      /* The left edge: a hairline between board and panel, dragged to resize. */
      #edge { position: fixed; left: 0; top: 0; bottom: 0; width: 5px; cursor: col-resize; z-index: 2; }
      #edge::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 1px; background: var(--line); }
      #edge:hover::before, #edge.dragging::before { width: 3px; background: var(--accent); }
      #toolbar {
        position: fixed; left: 5px; right: 0; top: 0; height: 40px; box-sizing: border-box;
        display: flex; align-items: center; gap: 2px; padding: 0 6px; border-bottom: 1px solid var(--line);
      }
      button {
        flex: none; width: 28px; height: 28px; display: grid; place-items: center; padding: 0;
        border: 0; border-radius: 6px; background: transparent; color: var(--muted); cursor: default;
      }
      button:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
      button:disabled { color: var(--faint); opacity: 0.5; }
      button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
      svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      #field { flex: 1; min-width: 0; position: relative; display: flex; align-items: center; margin: 0 4px; }
      #address {
        flex: 1; min-width: 0; height: 28px; box-sizing: border-box; padding: 0 8px; border: 1px solid transparent;
        border-radius: 6px; background: transparent; color: var(--ink); font: inherit; font-weight: 500;
        text-overflow: ellipsis;
      }
      #address:hover { background: var(--hover); }
      #address:focus { background: var(--sunken); border-color: var(--line); font-weight: 400; outline: none; }
      #address::placeholder { color: var(--muted); font-weight: 400; }
      #host { flex: none; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); padding-left: 6px; }
      #address:focus + #host, #host:empty { display: none; }
      #progress { position: fixed; left: 5px; right: 0; top: 38px; height: 2px; overflow: hidden; visibility: hidden; }
      #progress.on { visibility: visible; }
      #progress::after {
        content: ""; position: absolute; top: 0; bottom: 0; width: 30%; background: var(--accent);
        animation: none;
      }
      #progress.on::after { animation: slide 1.1s ease-in-out infinite; }
      @keyframes slide { from { left: -30%; } to { left: 100%; } }
      #reload .stop, #reload.loading .go { display: none; }
      #reload.loading .stop { display: block; }
    </style>
  </head>
  <body>
    <div id="edge" role="separator" aria-orientation="vertical" aria-label="Resize panel"></div>
    <div id="toolbar">
      <button id="back" type="button" aria-label="Back" title="Back" disabled>
        <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6" /></svg>
      </button>
      <button id="forward" type="button" aria-label="Forward" title="Forward" disabled>
        <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></svg>
      </button>
      <button id="reload" type="button" aria-label="Reload" title="Reload">
        <svg class="go" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" /><path d="M21 3v5h-5" /></svg>
        <svg class="stop" viewBox="0 0 24 24"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
      </button>
      <div id="field">
        <input id="address" type="text" spellcheck="false" autocomplete="off" aria-label="Address" placeholder="Enter a URL (localhost:5173, claude.ai/…)" />
        <span id="host"></span>
      </div>
      <button id="external" type="button" aria-label="Open in browser" title="Open in browser" disabled>
        <svg viewBox="0 0 24 24"><path d="M15 3h6v6" /><path d="M10 14 21 3" /><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" /></svg>
      </button>
      <button id="close" type="button" aria-label="Close panel" title="Close panel (⌘\)">
        <svg viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2" /><path d="M15 3v18" /><path d="m8 9 3 3-3 3" /></svg>
      </button>
    </div>
    <div id="progress"></div>
    <script src="chrome.js"></script>
  </body>
</html>
