<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1004" width="1100" height="1004" role="img" aria-label="How work flows through Cello: you ask, an agent claims, builds and tests, submits a review packet, and you approve or send it back.">
<style>
.blink { transform-box: fill-box; transform-origin: center; animation: blink 4.2s infinite; }
.d1 .blink { animation-delay: -1.3s; } .d2 .blink { animation-delay: -2.6s; } .d3 .blink { animation-delay: -3.4s; }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

.trav { animation: trav 22s ease-in-out infinite; }
.trav-hop { transform-box: fill-box; transform-origin: 50% 100%; animation: travHop 22s ease-in-out infinite; }
.trav-fade { animation: travFade 22s linear infinite; }
@keyframes trav { 0% { transform: translate(0px, 0px); } 8% { transform: translate(0px, 0px); } 13% { transform: translate(0px, 150px); } 16% { transform: translate(0px, 150px); } 18% { transform: translate(34px, 150px); } 22% { transform: translate(34px, 150px); } 24% { transform: translate(0px, 150px); } 27% { transform: translate(0px, 150px); } 31% { transform: translate(0px, 300px); } 35% { transform: translate(0px, 300px); } 38% { transform: translate(0px, 450px); } 44% { transform: translate(0px, 450px); } 52% { transform: translate(0px, 150px); } 60% { transform: translate(0px, 150px); } 63% { transform: translate(0px, 300px); } 67% { transform: translate(0px, 300px); } 70% { transform: translate(0px, 450px); } 76% { transform: translate(0px, 450px); } 80% { transform: translate(0px, 574px); } 84% { transform: translate(-187px, 574px); } 100% { transform: translate(-187px, 574px); } }
@keyframes travHop { 0%, 3%, 7.5%, 85%, 89%, 93%, 100% { transform: translateY(0) scale(1, 1); }
  5% { transform: translateY(-18px) scale(.95, 1.06); } 87% { transform: translateY(-22px) scale(.95, 1.06); } 91% { transform: translateY(-12px); }
  27.5%, 29%, 64%, 65.5% { transform: rotate(-8deg); } 28.2%, 64.8% { transform: rotate(8deg); } }
@keyframes travFade { 0% { opacity: 0; } 2% { opacity: 1; } 95% { opacity: 1; } 98%, 100% { opacity: 0; } }
@keyframes g1 { 0% { opacity: 0; } 0% { opacity: 0; } 1% { opacity: 1; } 12% { opacity: 1; } 13.5% { opacity: 0; } 100% { opacity: 0; } } @keyframes g2 { 0% { opacity: 0; } 11.5% { opacity: 0; } 13% { opacity: 1; } 31% { opacity: 1; } 32.5% { opacity: 0; } 50.5% { opacity: 0; } 52% { opacity: 1; } 67% { opacity: 1; } 68.5% { opacity: 0; } 100% { opacity: 0; } } @keyframes gAsk { 0% { opacity: 0; } 15.5% { opacity: 0; } 17% { opacity: 1; } 24% { opacity: 1; } 25.5% { opacity: 0; } 100% { opacity: 0; } } @keyframes g3 { 0% { opacity: 0; } 29.5% { opacity: 0; } 31% { opacity: 1; } 38% { opacity: 1; } 39.5% { opacity: 0; } 65.5% { opacity: 0; } 67% { opacity: 1; } 72% { opacity: 1; } 73.5% { opacity: 0; } 100% { opacity: 0; } }
@keyframes g4 { 0% { opacity: 0; } 36.5% { opacity: 0; } 38% { opacity: 1; } 46% { opacity: 1; } 47.5% { opacity: 0; } 70.5% { opacity: 0; } 72% { opacity: 1; } 80% { opacity: 1; } 81.5% { opacity: 0; } 100% { opacity: 0; } } @keyframes gDone { 0% { opacity: 0; } 82.5% { opacity: 0; } 84% { opacity: 1; } 96% { opacity: 1; } 97.5% { opacity: 0; } 100% { opacity: 0; } } @keyframes gWords { 0% { opacity: 0; } 42.5% { opacity: 0; } 44% { opacity: 1; } 54% { opacity: 1; } 55.5% { opacity: 0; } 100% { opacity: 0; } }
.g1 { animation: g1 22s infinite; } .g2 { animation: g2 22s infinite; } .gAsk { animation: gAsk 22s infinite; }
.g3 { animation: g3 22s infinite; } .g4 { animation: g4 22s infinite; } .gDone { animation: gDone 22s infinite; } .gWords { animation: gWords 22s infinite; }
.bubbleAsk { animation: gAsk 22s infinite; } .bubbleWords { animation: gWords 22s infinite; }
.note { offset-path: path("M 200 786 H 130 V 486 H 200"); offset-rotate: 0deg; animation: noteGo 22s ease-in-out infinite; }
@keyframes noteGo { 0%, 45% { offset-distance: 0%; opacity: 0; } 46% { opacity: 1; offset-distance: 0%; } 52% { offset-distance: 100%; opacity: 1; } 53%, 100% { offset-distance: 100%; opacity: 0; } }
.think { transform-box: fill-box; transform-origin: 50% 100%; animation: think 3.2s ease-in-out infinite alternate; }
@keyframes think { from { transform: rotate(-7deg); } to { transform: rotate(5deg); } }
.look { animation: look 22s ease-in-out infinite; }
@keyframes look { 0%, 16%, 25%, 100% { transform: translate(0, 0); } 18%, 23% { transform: translate(-60px, 10px); } }
.bob { animation: bob 2.6s ease-in-out infinite alternate; }
@keyframes bob { to { transform: translateY(-5px); } }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A1A1AA"/></marker><marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A16207"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EA6A1F"/></marker></defs>
<rect width="1100" height="1004" rx="16" fill="#FFFFFF"/>
<text x="40" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#18181B" text-anchor="start">How work flows through Cello</text><text x="40" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#52525B" text-anchor="start">Agents do the work through the cello CLI. You stay in the loop on a live board.</text><rect x="200" y="130" width="520" height="112" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/><circle cx="236" cy="168" r="17" fill="#2563EB"/><text x="236" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="698" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2563EB" text-anchor="end">YOU</text><text x="268" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="650" fill="#18181B" text-anchor="start">You ask for something</text><text x="268" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52525B" text-anchor="start">In chat with your agent, or as a card on the board</text><rect x="268" y="204" width="430" height="26" rx="6" fill="#F4F4F5"/><text x="280" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#3F3F46" text-anchor="start">cello task create &quot;Gift cards at checkout&quot;</text><line x1="460" y1="242" x2="460" y2="276" stroke="#A1A1AA" stroke-width="2" marker-end="url(#a)"/><rect x="200" y="280" width="520" height="112" rx="14" fill="#FFF4EC" stroke="#FDBA8C" stroke-width="1.5"/><rect class="g1" x="197" y="277" width="526" height="118" rx="16" fill="none" stroke="#EA6A1F" stroke-width="3" opacity="0"/><circle cx="236" cy="318" r="17" fill="#EA6A1F"/><text x="236" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="698" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#EA6A1F" text-anchor="end">AGENT</text><text x="268" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="650" fill="#18181B" text-anchor="start">An agent claims it</text><text x="268" y="342" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52525B" text-anchor="start">The card moves to In Progress and shows who is on it</text><rect x="268" y="354" width="430" height="26" rx="6" fill="#F4F4F5"/><text x="280" y="372" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#3F3F46" text-anchor="start">cello task claim SHOP-8</text><line x1="460" y1="392" x2="460" y2="426" stroke="#A1A1AA" stroke-width="2" marker-end="url(#a)"/><rect x="200" y="430" width="520" height="112" rx="14" fill="#FFF4EC" stroke="#FDBA8C" stroke-width="1.5"/><rect class="g2" x="197" y="427" width="526" height="118" rx="16" fill="none" stroke="#EA6A1F" stroke-width="3" opacity="0"/><circle cx="236" cy="468" r="17" fill="#EA6A1F"/><text x="236" y="474" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="698" y="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#EA6A1F" text-anchor="end">AGENT</text><text x="268" y="466" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="650" fill="#18181B" text-anchor="start">It builds and tests, in its own worktree</text><text x="268" y="492" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52525B" text-anchor="start">Test first, then a fresh reviewer agent reads the diff</text><rect x="268" y="504" width="430" height="26" rx="6" fill="#F4F4F5"/><text x="280" y="522" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#3F3F46" text-anchor="start">cello task stage SHOP-8 review</text><line x1="460" y1="542" x2="460" y2="576" stroke="#A1A1AA" stroke-width="2" marker-end="url(#a)"/><rect x="200" y="580" width="520" height="112" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/><rect class="g3" x="197" y="577" width="526" height="118" rx="16" fill="none" stroke="#7C3AED" stroke-width="3" opacity="0"/><circle cx="236" cy="618" r="17" fill="#7C3AED"/><text x="236" y="624" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="698" y="610" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#7C3AED" text-anchor="end">AGENT</text><text x="268" y="616" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="650" fill="#18181B" text-anchor="start">It hands you a review packet</text><text x="268" y="642" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52525B" text-anchor="start">A summary, steps to check, videos and screenshots</text><rect x="268" y="654" width="430" height="26" rx="6" fill="#F4F4F5"/><text x="280" y="672" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#3F3F46" text-anchor="start">cello task submit SHOP-8 --attach flow.mp4</text><line x1="460" y1="692" x2="460" y2="726" stroke="#A1A1AA" stroke-width="2" marker-end="url(#a)"/><rect x="200" y="730" width="520" height="112" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/><rect class="g4" x="197" y="727" width="526" height="118" rx="16" fill="none" stroke="#2563EB" stroke-width="3" opacity="0"/><circle cx="236" cy="768" r="17" fill="#2563EB"/><text x="236" y="774" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="698" y="760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2563EB" text-anchor="end">YOU</text><text x="268" y="766" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="650" fill="#18181B" text-anchor="start">You decide, on the Review page</text><text x="268" y="792" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52525B" text-anchor="start">Watch the evidence, then approve or send it back</text><rect x="268" y="804" width="430" height="26" rx="6" fill="#F4F4F5"/><text x="280" y="822" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#3F3F46" text-anchor="start">Approve  ·  Send back  ·  Comment</text><line x1="460" y1="842" x2="460" y2="882" stroke="#A1A1AA" stroke-width="2" marker-end="url(#a)"/><text x="472" y="870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#16A34A" text-anchor="start">Approve</text><rect x="370" y="886" width="180" height="48" rx="24" fill="#ECFDF5" stroke="#86EFAC" stroke-width="1.5"/><rect class="gDone" x="367" y="883" width="186" height="54" rx="27" fill="none" stroke="#16A34A" stroke-width="3" opacity="0"/><text x="460" y="917" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#16A34A" text-anchor="middle">Done</text><path d="M 200 786 H 130 V 486 H 196" fill="none" stroke="#EA6A1F" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#o)"/><g transform="translate(116 636) rotate(-90)"><text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#EA6A1F" text-anchor="middle">Send back with a note</text></g><g class="note" opacity="0"><g transform="translate(-15 -11)"><rect width="30" height="22" rx="5" fill="#EA6A1F"/><rect x="6" y="6" width="18" height="2.5" rx="1" fill="#FFFFFF"/><rect x="6" y="12" width="12" height="2.5" rx="1" fill="#FFFFFF"/></g></g><rect x="830" y="396" width="240" height="196" rx="14" fill="#FEFCE8" stroke="#FACC15" stroke-width="1.5" stroke-dasharray="6 5"/><rect class="gAsk" x="827" y="393" width="246" height="202" rx="16" fill="none" stroke="#A16207" stroke-width="3" opacity="0"/><text x="848" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#18181B" text-anchor="start">Stuck on a decision?</text><text x="848" y="456" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52525B" text-anchor="start">The agent asks on the card:</text><text x="848" y="477" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52525B" text-anchor="start">options, its pick and why.</text><text x="848" y="498" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52525B" text-anchor="start">The task waits in Needs input;</text><text x="848" y="519" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52525B" text-anchor="start">you answer next to the</text><text x="848" y="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52525B" text-anchor="start">screenshots, and it carries on.</text><rect x="848" y="554" width="204" height="22" rx="5" fill="#F4F4F5"/><text x="858" y="569" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#3F3F46" text-anchor="start">cello task ask SHOP-8</text><g transform="translate(1036 426)"><g class="think d2"><g transform="scale(0.0556) translate(-575 -570)">
<path d="M205 185 L312.4 633 A270 270 0 1 0 648.4 310.2 Z" fill="#FF7A2F" stroke="#FF7A2F" stroke-width="70" stroke-linejoin="round"/>
<path d="M205 185 L312.4 633 A270 270 0 1 0 648.4 310.2 Z" fill="#141416"/>
<g class="look"><g class="blink" fill="#FF7A2F"><rect x="470" y="513" width="80" height="124" rx="40"/><rect x="600" y="513" width="80" height="124" rx="40"/></g></g>
</g></g></g><g class="bubbleAsk" opacity="0"><circle cx="1012" cy="400" r="11" fill="#A16207"/><text x="1012" y="405" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">?</text></g><rect x="830" y="724" width="240" height="124" rx="14" fill="none" stroke="#A1A1AA" stroke-width="1.5" stroke-dasharray="6 5"/><rect class="gWords" x="827" y="721" width="246" height="130" rx="16" fill="none" stroke="#EA6A1F" stroke-width="3" opacity="0"/><text x="848" y="754" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#18181B" text-anchor="start">Your words reach it</text><text x="848" y="780" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52525B" text-anchor="start">Comments, notes and emoji</text><text x="848" y="800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52525B" text-anchor="start">land in the agent's session</text><text x="848" y="820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52525B" text-anchor="start">by themselves, even when</text><text x="848" y="840" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52525B" text-anchor="start">it's idle.</text><g transform="translate(1040 750)"><g class="bob d3"><g transform="scale(0.0519) translate(-575 -570)">
<path d="M205 185 L312.4 633 A270 270 0 1 0 648.4 310.2 Z" fill="#FF7A2F" stroke="#FF7A2F" stroke-width="70" stroke-linejoin="round"/>
<path d="M205 185 L312.4 633 A270 270 0 1 0 648.4 310.2 Z" fill="#FBF3E3"/>
<g class=""><g class="blink" fill="#FF7A2F"><rect x="470" y="513" width="80" height="124" rx="40"/><rect x="600" y="513" width="80" height="124" rx="40"/></g></g>
</g></g></g><g class="bubbleWords" opacity="0"><rect x="994" y="710" width="34" height="22" rx="8" fill="#EA6A1F"/><text x="1011" y="726" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">✎</text></g><g transform="translate(775 336)"><g class="trav"><g class="trav-fade"><g class="trav-hop d1"><g transform="scale(0.0741) translate(-575 -570)">
<path d="M205 185 L312.4 633 A270 270 0 1 0 648.4 310.2 Z" fill="#FF7A2F" stroke="#FF7A2F" stroke-width="70" stroke-linejoin="round"/>
<path d="M205 185 L312.4 633 A270 270 0 1 0 648.4 310.2 Z" fill="#141416"/>
<g class=""><g class="blink" fill="#FF7A2F"><rect x="470" y="513" width="80" height="124" rx="40"/><rect x="600" y="513" width="80" height="124" rx="40"/></g></g>
</g></g></g></g></g><text x="40" y="974" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52525B" text-anchor="start">Every change is an event: which agent, which conversation, when. The board replays it live.</text>
</svg>
