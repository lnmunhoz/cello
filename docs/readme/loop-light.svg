<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1004" width="1040" height="1004" role="img" aria-label="How work flows through Cello: you ask, an agent claims, builds and tests, submits a review packet, and you approve or send it back.">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A1A1AA"/></marker><marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A16207"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EA6A1F"/></marker></defs>
<rect width="1040" height="1004" rx="16" fill="#FFFFFF"/>
<text x="40" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#18181B" text-anchor="start">How work flows through Cello</text><text x="40" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#52525B" text-anchor="start">Agents do the work through the cello CLI. You stay in the loop on a live board.</text><rect x="190" y="130" width="540" height="112" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/><circle cx="226" cy="168" r="17" fill="#2563EB"/><text x="226" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="708" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2563EB" text-anchor="end">YOU</text><text x="258" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="650" fill="#18181B" text-anchor="start">You ask for something</text><text x="258" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52525B" text-anchor="start">In chat with your agent, or as a card on the board</text><rect x="258" y="204" width="450" height="26" rx="6" fill="#F4F4F5"/><text x="270" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#3F3F46" text-anchor="start">cello task create &quot;Gift cards at checkout&quot;</text><line x1="460" y1="242" x2="460" y2="276" stroke="#A1A1AA" stroke-width="2" marker-end="url(#a)"/><rect x="190" y="280" width="540" height="112" rx="14" fill="#FFF4EC" stroke="#FDBA8C" stroke-width="1.5"/><circle cx="226" cy="318" r="17" fill="#EA6A1F"/><text x="226" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="708" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#EA6A1F" text-anchor="end">AGENT</text><text x="258" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="650" fill="#18181B" text-anchor="start">An agent claims it</text><text x="258" y="342" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52525B" text-anchor="start">The card moves to In Progress and shows who is on it</text><rect x="258" y="354" width="450" height="26" rx="6" fill="#F4F4F5"/><text x="270" y="372" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#3F3F46" text-anchor="start">cello task claim SHOP-8</text><line x1="460" y1="392" x2="460" y2="426" stroke="#A1A1AA" stroke-width="2" marker-end="url(#a)"/><rect x="190" y="430" width="540" height="112" rx="14" fill="#FFF4EC" stroke="#FDBA8C" stroke-width="1.5"/><circle cx="226" cy="468" r="17" fill="#EA6A1F"/><text x="226" y="474" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="708" y="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#EA6A1F" text-anchor="end">AGENT</text><text x="258" y="466" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="650" fill="#18181B" text-anchor="start">It builds and tests, in its own worktree</text><text x="258" y="492" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52525B" text-anchor="start">Test first, then a fresh reviewer agent reads the diff</text><rect x="258" y="504" width="450" height="26" rx="6" fill="#F4F4F5"/><text x="270" y="522" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#3F3F46" text-anchor="start">cello task stage SHOP-8 review</text><line x1="460" y1="542" x2="460" y2="576" stroke="#A1A1AA" stroke-width="2" marker-end="url(#a)"/><rect x="190" y="580" width="540" height="112" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/><circle cx="226" cy="618" r="17" fill="#7C3AED"/><text x="226" y="624" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="708" y="610" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#7C3AED" text-anchor="end">AGENT</text><text x="258" y="616" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="650" fill="#18181B" text-anchor="start">It hands you a review packet</text><text x="258" y="642" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52525B" text-anchor="start">A summary, steps to check, videos and screenshots</text><rect x="258" y="654" width="450" height="26" rx="6" fill="#F4F4F5"/><text x="270" y="672" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#3F3F46" text-anchor="start">cello task submit SHOP-8 --attach flow.mp4</text><line x1="460" y1="692" x2="460" y2="726" stroke="#A1A1AA" stroke-width="2" marker-end="url(#a)"/><rect x="190" y="730" width="540" height="112" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/><circle cx="226" cy="768" r="17" fill="#2563EB"/><text x="226" y="774" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="708" y="760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2563EB" text-anchor="end">YOU</text><text x="258" y="766" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="650" fill="#18181B" text-anchor="start">You decide, on the Review page</text><text x="258" y="792" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52525B" text-anchor="start">Watch the evidence, then approve or send it back</text><rect x="258" y="804" width="450" height="26" rx="6" fill="#F4F4F5"/><text x="270" y="822" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#3F3F46" text-anchor="start">Approve  ·  Send back  ·  Comment</text><line x1="460" y1="842" x2="460" y2="882" stroke="#A1A1AA" stroke-width="2" marker-end="url(#a)"/><text x="472" y="870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#16A34A" text-anchor="start">Approve</text><rect x="370" y="886" width="180" height="48" rx="24" fill="#ECFDF5" stroke="#86EFAC" stroke-width="1.5"/><text x="460" y="917" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#16A34A" text-anchor="middle">Done</text><path d="M 190 786 H 120 V 486 H 186" fill="none" stroke="#EA6A1F" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#o)"/><g transform="translate(106 636) rotate(-90)"><text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#EA6A1F" text-anchor="middle">Send back with a note</text></g><rect x="780" y="396" width="230" height="196" rx="14" fill="#FEFCE8" stroke="#FACC15" stroke-width="1.5" stroke-dasharray="6 5"/><text x="798" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#18181B" text-anchor="start">Stuck on a decision?</text><text x="798" y="456" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52525B" text-anchor="start">The agent asks on the card:</text><text x="798" y="477" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52525B" text-anchor="start">options, its pick and why.</text><text x="798" y="498" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52525B" text-anchor="start">The task waits in Needs input;</text><text x="798" y="519" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52525B" text-anchor="start">you answer next to the</text><text x="798" y="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52525B" text-anchor="start">screenshots, and it carries on.</text><rect x="798" y="554" width="194" height="22" rx="5" fill="#F4F4F5"/><text x="808" y="569" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#3F3F46" text-anchor="start">cello task ask SHOP-8</text><line x1="734" y1="486" x2="776" y2="486" stroke="#A16207" stroke-width="2" stroke-dasharray="6 5" marker-start="url(#y)" marker-end="url(#y)"/><rect x="780" y="724" width="230" height="124" rx="14" fill="none" stroke="#A1A1AA" stroke-width="1.5" stroke-dasharray="6 5"/><text x="798" y="754" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#18181B" text-anchor="start">Your words reach it</text><text x="798" y="780" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52525B" text-anchor="start">Comments, notes and emoji</text><text x="798" y="800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52525B" text-anchor="start">land in the agent's session</text><text x="798" y="820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52525B" text-anchor="start">by themselves, even when</text><text x="798" y="840" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52525B" text-anchor="start">it's idle.</text><text x="40" y="974" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52525B" text-anchor="start">Every change is an event: which agent, which conversation, when. The board replays it live.</text>
</svg>
