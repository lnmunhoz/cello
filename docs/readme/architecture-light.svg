<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 846" width="1040" height="846" role="img" aria-label="Agents run the cello CLI against one local server; the board and desktop app update live; your comments flow back to the agents.">
<style>
.blink { transform-box: fill-box; transform-origin: center; animation: blink 4.2s infinite; }
.d1 .blink { animation-delay: -1.3s; } .d2 .blink { animation-delay: -2.6s; } .d3 .blink { animation-delay: -3.4s; }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
.cmd0 { offset-path: path("M 172 194 C 172 240, 398.2 250, 398.2 296"); animation: flow 2.4s ease-in 0.0s infinite; opacity: 0; }
.cmd1 { offset-path: path("M 404 194 C 404 240, 479.4 250, 479.4 296"); animation: flow 2.4s ease-in 0.6s infinite; opacity: 0; }
