.cmd3 { offset-path: path("M 868 194 C 868 240, 641.8 250, 641.8 296"); animation: flow 2.4s ease-in 1.8s infinite; opacity: 0; }
@keyframes flow { 0% { offset-distance: 0%; opacity: 0; } 10% { opacity: 1; } 85% { opacity: 1; } 100% { offset-distance: 100%; opacity: 0; } }
.hop { transform-box: fill-box; transform-origin: 50% 100%; animation: hop 3.6s ease-in-out infinite; }
@keyframes hop { 0%, 30%, 100% { transform: translateY(0) scale(1, 1); } 6% { transform: translateY(-8px) scale(.95, 1.05); } 12% { transform: translateY(0) scale(1.06, .94); } 16% { transform: scale(1, 1); } }
.pulse { animation: pulse 0.6s ease-out infinite alternate; }
@keyframes pulse { from { opacity: .15; } to { opacity: .9; } }
.ev0 { offset-path: path("M 345 450 V 526"); animation: flow 1.2s ease-in 0.0s infinite; opacity: 0; }
.ev1 { offset-path: path("M 755 450 V 526"); animation: flow 1.2s ease-in 0.6s infinite; opacity: 0; }
.carry { animation: carry 7s ease-in-out infinite; }
@keyframes carry { 0%, 18% { transform: translate(0, 0); } 30%, 52% { transform: translate(140px, 0); } 64%, 88% { transform: translate(280px, 0); } 96%, 100% { transform: translate(280px, 0); opacity: 1; } }
.lift { transform-box: fill-box; transform-origin: 50% 100%; animation: lift 7s ease-in-out infinite; }
@keyframes lift { 0%, 14%, 34%, 48%, 68%, 100% { transform: translateY(0); } 18%, 52% { transform: translateY(-7px) rotate(-6deg); } 24%, 58% { transform: translateY(-4px) rotate(4deg); } }
.msg { offset-path: path("M 630 781 H 1010 V 162 H 977"); offset-rotate: 0deg; animation: msg 5s ease-in-out infinite; }
@keyframes msg { 0% { offset-distance: 0%; opacity: 0; } 8% { opacity: 1; } 90% { opacity: 1; } 100% { offset-distance: 100%; opacity: 0; } }
</style>
