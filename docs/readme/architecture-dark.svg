nchor="middle">events</text><rect x="468.79999999999995" y="386" width="102.4" height="38" rx="8" fill="#0D1117" stroke="#5B3FB0"/><text x="520" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#A78BFA" text-anchor="middle">reviews</text><rect x="583.1999999999999" y="386" width="102.4" height="38" rx="8" fill="#0D1117" stroke="#5B3FB0"/><text x="634.4" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#A78BFA" text-anchor="middle">pages</text><rect x="697.5999999999999" y="386" width="102.4" height="38" rx="8" fill="#0D1117" stroke="#5B3FB0"/><text x="748.8" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#A78BFA" text-anchor="middle">backups</text><rect x="200" y="540" width="300" height="76" rx="12" fill="#0F1B2E" stroke="#1E40AF" stroke-width="1.5"/><text x="350" y="573" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="650" fill="#F4F4F5" text-anchor="middle">Board in the browser</text><text x="350" y="596" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#A1A1AA" text-anchor="middle">kanban, list, review, pages</text><line x1="350" y1="450" x2="350" y2="536" stroke="#52525B" stroke-width="2" marker-end="url(#a)"/><rect x="540" y="540" width="300" height="76" rx="12" fill="#0F1B2E" stroke="#1E40AF" stroke-width="1.5"/><text x="690" y="573" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="650" fill="#F4F4F5" text-anchor="middle">Desktop app</text><text x="690" y="596" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#A1A1AA" text-anchor="middle">dock icon, side panel, cello:// links</text><line x1="690" y1="450" x2="690" y2="536" stroke="#52525B" stroke-width="2" marker-end="url(#a)"/><text x="520" y="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="italic" fill="#A1A1AA" text-anchor="middle">live over a WebSocket, in well under 100 ms</text><rect x="410" y="676" width="220" height="50" rx="25" fill="#1F2328" stroke="#52525B"/><text x="520" y="708" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#F4F4F5" text-anchor="middle">You</text><line x1="350" y1="616" x2="452" y2="672" stroke="#52525B" stroke-width="2" marker-end="url(#a)"/><line x1="690" y1="616" x2="588" y2="672" stroke="#52525B" stroke-width="2" marker-end="url(#a)"/><path d="M 630 701 H 994 V 162 H 977" fill="none" stroke="#FF8A47" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#o)"/><text x="648" y="692" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FF8A47" text-anchor="start">your comments and answers reach the agent</text>
